name: Haven CI

on:
  push:
    paths: ["haven/**", ".github/workflows/haven-ci.yml"]
  pull_request:
    paths: ["haven/**", ".github/workflows/haven-ci.yml"]

defaults:
  run:
    working-directory: haven

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haven
          POSTGRES_PASSWORD: haven
          POSTGRES_DB: haven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haven" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://haven:haven@localhost:5432/haven
      APP_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: haven/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
