name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (DNS filter) against the runner's Android SDK
        run: gradle -p typecheck test -PandroidJar=$ANDROID_HOME/platforms/android-34/android.jar
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: haven-kids-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
