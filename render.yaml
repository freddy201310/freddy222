# Render Blueprint: one-click deploy of Haven (website + database).
# Click "Deploy to Render" in README.md, sign in with GitHub, and confirm.
# Every push to the main branch redeploys automatically.
services:
  - type: web
    name: haven
    runtime: node
    rootDir: haven
    plan: starter # always on. The free plan pauses when idle, and children's phones need it awake.
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy # creates/updates database tables on every deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: haven-db
          property: connectionString
      - key: APP_SECRET # encrypts two-step sign-in secrets: never change it after launch
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CONTACT_EMAIL
        sync: false # Render asks you for this during setup
      - key: COMPANY_NAME
        value: Haven
      # Add these later in the Render dashboard (Environment tab) when you have them:
      # APP_URL (once you connect your own domain), RESEND_API_KEY, EMAIL_FROM,
      # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM, SENTRY_DSN,
      # STRIPE_SECRET_KEY, STRIPE_PRICE_ID, STRIPE_WEBHOOK_SECRET, NEXT_PUBLIC_PRICE_LABEL

databases:
  - name: haven-db
    databaseName: haven
    user: haven
    plan: basic-256mb
    diskSizeGB: 1
